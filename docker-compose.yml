version: "3.8"

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - .:/app
    command: npm run dev
 
  worker:
    build: .
    command: node src/workers/jobWorker.js
    depends_on:
      - redis
      
    environment:
      - REDIS_URL=redis://redis:6379 

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"